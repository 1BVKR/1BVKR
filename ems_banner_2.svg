      0%,5%  { width:0 }
      50%,80%{ width:380px }
      92%,100%{ width:0 }
    }
    @keyframes typeSub {
      0%,15% { width:0 }
      55%,80%{ width:320px }
      92%,100%{ width:0 }
    }
    @keyframes typeTag {
      0%,25% { width:0 }
      60%,80%{ width:280px }
      92%,100%{ width:0 }
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes glow  { 0%,100%{opacity:0.6} 50%{opacity:1} }
