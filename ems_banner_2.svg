  <clipPath id="ct">
    <rect x="72" y="62" height="30" width="0">
      <animate attributeName="width" values="0;380px;380px;0;0" keyTimes="0;0.45;0.8;0.92;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="cs">
    <rect x="72" y="104" height="24" width="0">
      <animate attributeName="width" values="0;320px;320px;0;0" keyTimes="0;0.5;0.8;0.92;1" dur="7s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="cg">
    <rect x="72" y="140" height="22" width="0">
      <animate attributeName="width" values="0;280px;280px;0;0" keyTimes="0;0.52;0.8;0.92;1" dur="7s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="card-clip">
    <rect width="800" height="240" rx="14"/>
  </clipPath>
